<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Cyber Obsidian -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234" />
      <stop offset="45%" stop-color="#101624" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Outer Rim Gradient: Vibrant Cyber Neon Border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="35%" stop-color="#00D2FF" />
      <stop offset="70%" stop-color="#7C4DFF" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- OLED Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060A12" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>

    <!-- Screen Bezel/Border -->
    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2D42" />
      <stop offset="100%" stop-color="#0D1624" />
    </linearGradient>

    <!-- Key Button Gradients matching Calculator Themes -->
    <!-- 1. Coral Red (Operators) -->
    <linearGradient id="btnRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B5C" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>

    <!-- 2. Electric Blue / Indigo (Specials) -->
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F6AF6" />
      <stop offset="100%" stop-color="#3949AB" />
    </linearGradient>

    <!-- 3. Amber / Golden Yellow (Numbers) -->
    <linearGradient id="btnYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FB8C00" />
    </linearGradient>

    <!-- 4. Hero Facundo Neon Green (Equals) -->
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#00C853" />
    </linearGradient>

    <!-- Button Highlight Rim -->
    <linearGradient id="btnHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>

    <!-- Button Inner Shadow -->
    <linearGradient id="keyInnerShadow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="equalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00F59B" flood-opacity="0.75" />
    </filter>

    <filter id="neonStar" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00F59B" flood-opacity="0.9" />
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F0E68C" flood-opacity="0.6" />
    </filter>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Clip Path for the Squircle Body -->
    <clipPath id="squircleClip">
      <rect x="20" y="20" width="472" height="472" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- 1. Ambient Drop Shadow & Squircle Body -->
  <g filter="url(#softShadow)">
    <rect x="20" y="20" width="472" height="472" rx="108" ry="108" fill="url(#bodyGrad)" stroke="url(#rimGrad)" stroke-width="7" />
  </g>

  <!-- 2. Glassmorphism Top-Gloss Reflection -->
  <g clip-path="url(#squircleClip)">
    <path d="M 20 20 L 492 20 L 492 190 C 350 165 170 185 20 285 Z" fill="url(#glassGloss)" pointer-events="none" />
  </g>

  <!-- 3. LCD Screen Display -->
  <g id="screen">
    <!-- Screen Bezel -->
    <rect x="54" y="54" width="404" height="124" rx="24" fill="url(#screenGrad)" stroke="url(#screenBorder)" stroke-width="3.5" />
    
    <!-- Mini Solar / Status Bar (Top Left) -->
    <rect x="74" y="68" width="15" height="5" rx="2.5" fill="#00F59B" opacity="0.65" />
    <rect x="94" y="68" width="15" height="5" rx="2.5" fill="#00F59B" opacity="0.65" />
    <rect x="114" y="68" width="15" height="5" rx="2.5" fill="#00F59B" opacity="0.65" />
    <rect x="134" y="68" width="15" height="5" rx="2.5" fill="#00D2FF" opacity="0.45" />

    <!-- Status Power Dot (Top Right) -->
    <circle cx="438" cy="70" r="4.5" fill="#00F59B" filter="url(#neonStar)" />

    <!-- Brand Emblem: F✦ on Left -->
    <text x="74" y="142" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" fill="#00F59B" letter-spacing="1">F<tspan font-size="28" fill="#00D2FF" font-weight="700" dx="3">✦</tspan></text>
    
    <!-- Digital Math Readout: 123 on Right -->
    <text x="438" y="144" text-anchor="end" font-family="'Chakra Petch', 'Roboto Mono', 'Courier New', monospace" font-weight="900" font-size="52" fill="#F0E68C" letter-spacing="2" filter="url(#glowAmber)">123</text>
  </g>

  <!-- 4. Keypad Grid (4 Hero Buttons) -->
  <!-- Button 1: Plus (+) - Coral Red -->
  <g id="btn-plus">
    <rect x="54" y="202" width="193" height="120" rx="24" fill="url(#btnRed)" stroke="url(#btnHighlight)" stroke-width="2.5" />
    <rect x="54" y="202" width="193" height="120" rx="24" fill="url(#keyInnerShadow)" pointer-events="none" />
    <!-- Plus Icon (Thick, perfectly centered at 150.5, 262) -->
    <path d="M 150.5 238 L 150.5 286 M 126.5 262 L 174.5 262" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Button 2: Minus (−) - Indigo Blue -->
  <g id="btn-minus">
    <rect x="265" y="202" width="193" height="120" rx="24" fill="url(#btnBlue)" stroke="url(#btnHighlight)" stroke-width="2.5" />
    <rect x="265" y="202" width="193" height="120" rx="24" fill="url(#keyInnerShadow)" pointer-events="none" />
    <!-- Minus Icon (Centered at 361.5, 262) -->
    <path d="M 337.5 262 L 385.5 262" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Button 3: Multiply (×) - Amber Gold -->
  <g id="btn-multiply">
    <rect x="54" y="338" width="193" height="120" rx="24" fill="url(#btnYellow)" stroke="url(#btnHighlight)" stroke-width="2.5" />
    <rect x="54" y="338" width="193" height="120" rx="24" fill="url(#keyInnerShadow)" pointer-events="none" />
    <!-- Multiply Icon (Centered at 150.5, 398) -->
    <path d="M 133 380.5 L 168 415.5 M 168 380.5 L 133 415.5" stroke="#101726" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Button 4: Equal (=) - Facundo Hero Neon Green with Bloom! -->
  <g id="btn-equal" filter="url(#equalGlow)">
    <rect x="265" y="338" width="193" height="120" rx="24" fill="url(#btnGreen)" stroke="url(#btnHighlight)" stroke-width="3" />
    <rect x="265" y="338" width="193" height="120" rx="24" fill="url(#keyInnerShadow)" pointer-events="none" />
    <!-- Equal Icon (Centered at 361.5, 398) -->
    <path d="M 337.5 387 L 385.5 387 M 337.5 409 L 385.5 409" stroke="#052E16" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
